[package]
name = "neo-devpack"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/neo-devpack"
description = "Neo N3 Rust Development Pack for Smart Contract Development"
rust-version.workspace = true
keywords = ["neo", "neovm", "blockchain", "smart-contracts", "sdk"]
categories = ["cryptography::cryptocurrencies", "development-tools::ffi"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "Cargo.toml", "../LICENSE"]

[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
postcard = { version = "1.1", default-features = false, features = ["alloc"], optional = true }

neo-types = { workspace = true, default-features = false }
neo-syscalls = { workspace = true, default-features = false }
neo-runtime = { workspace = true, default-features = false }
neo-macros = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = ["std"]
std = [
    "serde",
    "neo-types/std",
    "neo-types/serde",
    "neo-syscalls/std",
    "neo-runtime/std",
    "postcard/use-std",
    "serde/std",
    "serde_json/std",
]
serde = ["dep:postcard", "dep:serde", "dep:serde_json"]

[lib]
name = "neo_devpack"
path = "src/lib.rs"
