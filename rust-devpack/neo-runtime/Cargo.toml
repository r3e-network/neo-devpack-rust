[package]
name = "neo-runtime"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Neo N3 Runtime Stubs"
documentation = "https://docs.rs/neo-runtime"
rust-version.workspace = true
keywords = ["neo", "neovm", "blockchain", "smart-contracts", "runtime"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*", "Cargo.toml", "README.md", "../../LICENSE"]

[dependencies]
neo-types = { workspace = true, default-features = false }
neo-syscalls = { workspace = true, default-features = false }
num-bigint = { version = "0.4", default-features = false, optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
sha2 = { version = "0.10", default-features = false, optional = true }
ripemd = { version = "0.1", default-features = false, optional = true }
tiny-keccak = { version = "2.0", default-features = false, features = ["keccak"], optional = true }

[features]
default = ["std"]
std = [
    "crypto-hashes",
    "json",
    "neo-types/std",
    "neo-types/serde",
    "neo-syscalls/std",
    "num-bigint/std",
    "ripemd/std",
    "serde_json/std",
    "sha2/std",
]
crypto-hashes = ["dep:ripemd", "dep:sha2", "dep:tiny-keccak"]
json = ["dep:num-bigint", "dep:serde_json"]
