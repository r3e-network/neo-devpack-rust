[package]
name = "neo-syscalls"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Neo N3 Syscall Definitions"
documentation = "https://docs.rs/neo-syscalls"
rust-version.workspace = true
keywords = ["neo", "neovm", "blockchain", "smart-contracts", "syscalls"]
categories = ["cryptography::cryptocurrencies"]
include = ["src/**/*", "Cargo.toml", "README.md", "../../LICENSE"]

[dependencies]
neo-types = { workspace = true, default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
once_cell = { workspace = true }

[features]
default = ["std"]
std = ["neo-types/std", "neo-types/serde"]
