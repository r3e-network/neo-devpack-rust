[package]
name = "neo-types"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Neo N3 Core Types for Smart Contract Development"
documentation = "https://docs.rs/neo-types"
rust-version.workspace = true
keywords = ["neo", "neovm", "blockchain", "smart-contracts", "types"]
categories = ["cryptography::cryptocurrencies", "data-structures"]
include = ["src/**/*", "Cargo.toml", "README.md", "../../LICENSE"]

[dependencies]
serde = { workspace = true, optional = true }
num-bigint = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }

[features]
default = ["std", "serde"]
std = ["num-bigint/std", "num-traits/std"]
serde = ["dep:serde", "num-bigint/serde"]
