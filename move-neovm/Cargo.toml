[package]
name = "move-neovm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "⚠️ EXPERIMENTAL — Move bytecode to NeoVM translator. Not production-ready; coverage is incomplete."
rust-version.workspace = true
keywords = ["neo", "neovm", "move", "blockchain", "smart-contracts"]
categories = ["cryptography::cryptocurrencies", "development-tools"]
include = ["src/**/*", "tests/**/*", "benches/**/*", "Cargo.toml", "README.md", "../LICENSE"]

[dependencies]
anyhow = { workspace = true }
wasm-encoder = { workspace = true }

[dev-dependencies]
wasmparser = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "bytecode_translation"
harness = false

[features]
default = []
