[package]
name = "cross-call-wrapper-neo"
version = "0.14.0"
edition = "2021"
description = "L6: sample contract that performs a cross-contract call to a NEP-17 token"
keywords = ["neo", "n3", "smart-contract", "cross-call"]
license = "MIT"
repository = "https://github.com/r3e-network/neo-devpack-rust"
homepage = "https://github.com/r3e-network/neo-devpack-rust"
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.14.0", default-features = false }

[features]
default = ["neo-devpack/std"]
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
