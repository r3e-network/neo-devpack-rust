[package]
name = "fuzz-ops"
version = "0.13.1"
edition = "2021"
description = "Differential-fuzz target: wide single-op surface for NeoVM translator hunting"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "refgen"
path = "src/bin/refgen.rs"

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.13.1", default-features = false }

[features]
default = ["neo-devpack/std"]

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
