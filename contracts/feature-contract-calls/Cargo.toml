[package]
name = "contract-calls-neo"
version = "0.14.1"
edition = "2021"
description = "Feature-coverage sample: contract calls + native hashes + NeoError"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.14.1", default-features = false }

[features]
default = ["neo-devpack/std"]

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
