[package]
name = "nep11-macro-sample-neo"
version = "0.12.0"
edition = "2021"
description = "Integration test for the nep11! standard-library macro (L5)"
license = "MIT"
repository = "https://github.com/r3e-network/neo-devpack-rust"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.12.0", default-features = false }

[features]
default = ["neo-devpack/std"]
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
