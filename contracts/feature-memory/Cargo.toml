[package]
name = "memory-neo"
version = "0.14.0"
edition = "2021"
description = "Feature-coverage sample: heap, globals, memory ops"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.14.0", default-features = false }

[features]
default = ["neo-devpack/std"]

[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
