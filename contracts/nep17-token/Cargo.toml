[package]
name = "nep17-token-neo"
version = "0.13.1"
edition = "2021"
description = "Neo N3 NEP-17 compliant fungible token smart contract with transfer and balance management"
keywords = ["neo", "n3", "smart-contract"]
license = "MIT"
repository = "https://github.com/r3e-network/neo-devpack-rust"
homepage = "https://github.com/r3e-network/neo-devpack-rust"
categories = ["cryptography::cryptocurrencies", "wasm"]

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-devpack = { path = "../../rust-devpack", version = "0.13.1", default-features = false }

[features]
default = ["neo-devpack/std"]
[workspace]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
